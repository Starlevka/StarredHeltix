<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarredHeltix — С Новым Годом! ❄️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: white;
        }

        /* Snow container */
        #snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        /* Garland */
        .garland {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            z-index: 5;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: flash 1.5s infinite;
        }

        @keyframes flash {
            0%, 100% { opacity: 0.4; box-shadow: 0 0 5px currentColor; }
            50% { opacity: 1; box-shadow: 0 0 15px currentColor; }
        }

        .light:nth-child(4n+1) { color: #ff0000; background: #ff0000; animation-delay: 0s; }
        .light:nth-child(4n+2) { color: #00ff00; background: #00ff00; animation-delay: 0.4s; }
        .light:nth-child(4n+3) { color: #ffff00; background: #ffff00; animation-delay: 0.8s; }
        .light:nth-child(4n+4) { color: #0000ff; background: #0000ff; animation-delay: 1.2s; }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 650px;
            width: 100%;
        }

        .card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 50px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #a5f3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a5f3fc;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s;
        }

        .feature:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.1);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #0ea5e9;
            color: white;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
        }

        .btn-primary:hover {
            background: #0284c7;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 500px) {
            .features { grid-template-columns: 1fr; }
            .buttons { flex-direction: column; }
            .title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="garland" id="garland"></div>
    <div id="snow-container"></div>

    <div class="container">
        <div class="card">
            <h1 class="title">
                <span>❄️</span>
                StarredHeltix
            </h1>
            <p class="subtitle">Новогоднее обновление 0.0.11</p>

            <div class="features">
                <div class="feature"><span>🧩</span> Солверы и Авто-Слеер</div>
                <div class="feature"><span>❄️</span> Зимняя атмосфера</div>
                <div class="feature"><span>👤</span> NPC Мега-ящик?</div>
                <div class="feature"><span>💡</span> Fullbright и Оптимизация</div>
                <div class="feature"><span>🎮</span> QOL и Команды</div>
                <div class="feature"><span>🎨</span> HUD Редактор</div>
            </div>

            <div class="buttons">
                <a href="https://github.com/Starlevka/StarredHeltix/releases/latest" class="btn btn-primary">
                    <span>⬇️</span> Скачать мод
                </a>
                <a href="https://github.com/Starlevka/StarredHeltix" class="btn btn-secondary">
                    <span>🔗</span> GitHub
                </a>
            </div>

            <div class="footer">
                <p>Версия 0.0.11 • Minecraft 1.21.10 • Java 21+</p>
                <p style="margin-top: 8px;">Счастливого Нового Года! ★</p>
            </div>
        </div>
    </div>

    <script>
        // Snow
        function createSnow() {
            const container = document.getElementById('snow-container');
            const count = 60;
            for (let i = 0; i < count; i++) {
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                const size = Math.random() * 4 + 2 + 'px';
                snow.style.width = size;
                snow.style.height = size;
                snow.style.left = Math.random() * 100 + '%';
                snow.style.animationDuration = Math.random() * 3 + 2 + 's';
                snow.style.animationDelay = Math.random() * 5 + 's';
                snow.style.opacity = Math.random();
                container.appendChild(snow);
            }
        }

        // Garland
        function createGarland() {
            const garland = document.getElementById('garland');
            const count = 25;
            for (let i = 0; i < count; i++) {
                const light = document.createElement('div');
                light.className = 'light';
                garland.appendChild(light);
            }
        }

        createSnow();
        createGarland();
    </script>
</body>
</html>
