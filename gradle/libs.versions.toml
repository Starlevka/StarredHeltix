[versions]
# Gradle & Build
gradle = "9.4.1"
loom = "1.17.1"

# Minecraft & Fabric
minecraft = "26.2"
fabricLoader = "0.19.3"
fabricApi = "0.154.2+26.2"
fabricKotlin = "1.14.1+kotlin.2.4.20"

# Languages
kotlin = "2.4.0"
java = "25"

# Libraries
modMenu = "20.0.1"
moulConfig = "4.7.2"
caffeine = "3.2.4"
rhino = "1.9.1"

[libraries]
# Minecraft & Fabric
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }
fabricKotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabricKotlin" }

# Mods
moulConfig = { group = "org.notenoughupdates.moulconfig", name = "modern-26.2", version.ref = "moulConfig" }
modMenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modMenu" }
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
rhino = { group = "org.mozilla", name = "rhino-all", version.ref = "rhino" }

[bundles]
fabric = ["fabricLoader", "fabricApi", "fabricKotlin"]

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
mavenPublish = { id = "maven-publish" }

